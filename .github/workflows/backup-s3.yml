---
name: backup-s3

on:
  workflow_dispatch:
    inputs:
      cf_space:
        description: cloud.gov space to back up
        required: true
        type: choice
        options:
          - all
          - development
          - staging
          - prod
      service_name:
        description: S3 service to back up
        required: true
        type: choice
        options:
          - all
          - inventory-s3
          - datagov-catalog-s3
  schedule:
    # Sundays at 07:00 UTC.
    - cron: "0 7 * * 0"

permissions:
  contents: read

jobs:
  backup:
    name: backup ${{ matrix.service_name }} (${{ matrix.cf_space }})
    runs-on: ubuntu-latest
    environment: ${{ matrix.cf_space == 'prod' && 'production' || matrix.cf_space }}
    concurrency:
      group: backup-s3-${{ matrix.cf_space }}-${{ matrix.service_name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        cf_space: ${{ github.event_name != 'workflow_dispatch' && fromJSON('["development","staging","prod"]') || inputs.cf_space == 'all' && fromJSON('["development","staging","prod"]') || fromJSON(format('["{0}"]', inputs.cf_space)) }}
        service_name: ${{ github.event_name != 'workflow_dispatch' && fromJSON(vars.S3_BACKUP_SERVICE_NAMES) || inputs.service_name == 'all' && fromJSON(vars.S3_BACKUP_SERVICE_NAMES) || fromJSON(format('["{0}"]', inputs.service_name)) }}
    env:
      BACKUP_PREFIX: backup-manager-90-day-retention
      CF_ORG: gsa-datagov
      CF_SPACE: ${{ matrix.cf_space }}
      SERVICE_NAME: ${{ matrix.service_name }}

    steps:
      - name: backup source S3 bucket
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: |
            cf run-task backup-manager -m 1G --wait --name "backup-s3-${SERVICE_NAME}-${GITHUB_RUN_ID}" --command "backup s3 ${SERVICE_NAME}"
          cf_org: ${{ env.CF_ORG }}
          cf_space: ${{ env.CF_SPACE }}
          cf_username: ${{ secrets.CF_SERVICE_USER }}
          cf_password: ${{ secrets.CF_SERVICE_AUTH }}

      - name: show backup-manager logs on failure
        if: failure()
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: |
            cf logs backup-manager --recent
          cf_org: ${{ env.CF_ORG }}
          cf_space: ${{ env.CF_SPACE }}
          cf_username: ${{ secrets.CF_SERVICE_USER }}
          cf_password: ${{ secrets.CF_SERVICE_AUTH }}
