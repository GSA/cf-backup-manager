---
name: backup-s3

on:
  workflow_dispatch:
  schedule:
    # Sundays at 07:00 UTC.
    - cron: "0 7 * * 0"

permissions:
  contents: read

jobs:
  backup:
    name: backup ${{ matrix.service_name }} (${{ matrix.cf_space }})
    runs-on: ubuntu-latest
    environment: ${{ matrix.cf_space == 'prod' && 'production' || matrix.cf_space }}
    concurrency:
      group: backup-s3-${{ matrix.cf_space }}-${{ matrix.service_name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        cf_space:
          - development
          - staging
          - prod
        service_name: ${{ fromJSON(vars.S3_BACKUP_SERVICE_NAMES) }}
    env:
      BACKUP_PREFIX: backup-manager-90-day-retention
      CF_ORG: gsa-datagov
      CF_SPACE: ${{ matrix.cf_space }}
      SERVICE_NAME: ${{ matrix.service_name }}

    steps:
      - name: backup source S3 bucket
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: |
            cf run-task backup-manager --wait --name "backup-s3-${SERVICE_NAME}-${GITHUB_RUN_ID}" --command "backup s3 ${SERVICE_NAME}"
          cf_org: ${{ env.CF_ORG }}
          cf_space: ${{ env.CF_SPACE }}
          cf_username: ${{ secrets.CF_SERVICE_USER }}
          cf_password: ${{ secrets.CF_SERVICE_AUTH }}

      - name: show backup-manager logs on failure
        if: failure()
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: |
            cf logs backup-manager --recent
          cf_org: ${{ env.CF_ORG }}
          cf_space: ${{ env.CF_SPACE }}
          cf_username: ${{ secrets.CF_SERVICE_USER }}
          cf_password: ${{ secrets.CF_SERVICE_AUTH }}
